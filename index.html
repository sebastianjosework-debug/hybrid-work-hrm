<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Work & RTO Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card-radio:checked + div { border-color: #3b82f6; background-color: #eff6ff; }
        .hide { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white">
            <h2 class="text-2xl font-bold">Future of Work Survey</h2>
            <p class="text-blue-100 text-sm mt-2">Help us design a data-backed hybrid policy. <span id="progress-text">Question 1 of 15</span></p>
            <div class="w-full bg-blue-800 rounded-full h-2 mt-4">
                <div class="bg-blue-300 h-2 rounded-full transition-all duration-300" id="progress-bar" style="width: 6%"></div>
            </div>
        </div>

        <!-- Dynamic Form Container -->
        <div class="p-6 md:p-8">
            <div id="question-container">
                <!-- JavaScript will inject questions here -->
            </div>

            <!-- Navigation -->
            <div class="flex justify-between mt-8 pt-4 border-t border-gray-100">
                <button id="prev-btn" class="px-5 py-2 text-gray-600 font-medium hover:text-gray-900 hidden" onclick="navigate(-1)">Back</button>
                <div class="flex-1"></div>
                <button id="next-btn" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors" onclick="navigate(1)">Next</button>
            </div>
        </div>
    </div>

    <script>
        // The 15 Data-Backed Questions mapping to the HR Frameworks
        const questions = [
            // Demographics
            { id: 'q1', type: 'radio', text: '1. Which age group do you belong to?', options: ['Under 25', '26 - 35', '36 - 45', '46 and above'] },
            { id: 'q2', type: 'radio', text: '2. Which department are you in?', options: ['Engineering / IT', 'Product / Design', 'Sales / Marketing', 'Ops / HR / Finance'] },
            { id: 'q3', type: 'radio', text: '3. What is your current base location?', options: ['Mumbai', 'Bengaluru', 'Delhi NCR', 'Pune / Hyderabad', 'Tier-2/3 City (Remote)'] },
            { id: 'q4', type: 'radio', text: '4. What is your biggest Work-From-Home challenge?', options: ['Lack of quiet space / Family distractions', 'Power / Internet disruptions', 'Isolation / Lack of mentorship', 'I have no WFH challenges'] },
            
            // Commute Friction
            { id: 'q5', type: 'radio', text: '5. What is your estimated one-way commute time to the office?', options: ['Under 30 mins', '30 - 60 mins', '60 - 90 mins', 'Over 90 mins'] },
            { id: 'q6', type: 'radio', text: '6. On a scale of 1-5, how physically/mentally draining is your commute?', options: ['1 - Barely noticeable', '2 - Manageable', '3 - Noticeable drain', '4 - Exhausting', '5 - Ruins my productivity'] },
            { id: 'q7', type: 'radio', text: '7. If required to come in 4 days a week, what is your primary friction point?', options: ['Traffic & Travel Time', 'Cost (Cabs, Fuel, Rents)', 'Public Transit Crowds', 'Would need to relocate from hometown'] },

            // Collaborative Density
            { id: 'q8', type: 'radio', text: '8. In a typical week, how is your time split?', options: ['Mostly Deep Solo Work (80% solo / 20% collab)', 'Balanced (50% solo / 50% collab)', 'Highly Collaborative (20% solo / 80% collab)', 'Total ad-hoc / unpredictable'] },
            { id: 'q9', type: 'radio', text: '9. How effective is the OFFICE for your Deep Solo Work?', options: ['1 - Very Distracting', '2 - Somewhat Distracting', '3 - Neutral', '4 - Good', '5 - Excellent'] },
            { id: 'q10', type: 'radio', text: '10. How effective is the OFFICE for Team Collaboration?', options: ['1 - Poor', '2 - Below Average', '3 - Neutral', '4 - Good', '5 - Excellent'] },

            // Real Estate Utility
            { id: 'q11', type: 'radio', text: '11. What is the most valuable reason for you to visit the office?', options: ['Face-to-face team syncs & whiteboarding', 'Ergonomic setups, AC, & High-speed Internet', 'Free meals & socializing', 'Mental separation of work and home'] },
            { id: 'q12', type: 'radio', text: '12. What is the biggest distraction when working in the office?', options: ['Loud open-plan seating', 'Too many ad-hoc taps on the shoulder', 'Commute exhaustion carrying into the day', 'Inadequate desk / monitor setups'] },

            // Autonomy & Policy Acceptance
            { id: 'q13', type: 'radio', text: '13. What is your ideal hybrid structure?', options: ['Fully Remote', '1-2 Days in Office', '3-4 Days in Office', '5 Days in Office'] },
            { id: 'q14', type: 'radio', text: '14. How should in-office days be scheduled?', options: ['Central Mandate (e.g., Everyone Tue/Thu)', 'Team-Level (Managers set 2 anchor days)', 'Monthly Burst (1 full week in, 3 weeks remote)', 'Total Autonomy (Employees choose daily)'] },
            { id: 'q15', type: 'radio', text: '15. If a strict 4-day RTO mandate was enforced tomorrow, what would be the impact?', options: ['Would comply happily', 'Would comply, but with lowered morale', 'Would start passively looking for remote roles', 'Would actively resign'] }
        ];

        let currentStep = 0;
        const responses = {};

        function renderQuestion() {
            const container = document.getElementById('question-container');
            const q = questions[currentStep];
            
            let html = `<div class="animate-fade-in"><h3 class="text-xl font-semibold text-gray-800 mb-6">${q.text}</h3><div class="space-y-3">`;
            
            q.options.forEach((opt, index) => {
                const isChecked = responses[q.id] === opt ? 'checked' : '';
                html += `
                    <label class="block cursor-pointer">
                        <input type="radio" name="${q.id}" value="${opt}" class="card-radio sr-only" onchange="saveResponse('${q.id}', '${opt}')" ${isChecked}>
                        <div class="p-4 border-2 border-gray-200 rounded-xl hover:border-blue-300 transition-colors">
                            <span class="text-gray-700 font-medium">${opt}</span>
                        </div>
                    </label>
                `;
            });
            
            html += `</div></div>`;
            container.innerHTML = html;

            // Update UI State
            document.getElementById('progress-text').innerText = `Question ${currentStep + 1} of ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentStep + 1) / questions.length) * 100}%`;
            
            document.getElementById('prev-btn').style.display = currentStep === 0 ? 'none' : 'block';
            document.getElementById('next-btn').innerText = currentStep === questions.length - 1 ? 'Submit Responses' : 'Next';
            
            // Disable next if no option selected
            checkNextButtonState(q.id);
        }

        function saveResponse(qId, val) {
            responses[qId] = val;
            checkNextButtonState(qId);
            // Auto-advance for better UX (optional)
            setTimeout(() => { if(currentStep < questions.length -1) navigate(1); }, 350);
        }

        function checkNextButtonState(qId) {
            const btn = document.getElementById('next-btn');
            if (responses[qId]) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.disabled = false;
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.disabled = true;
            }
        }

        function navigate(dir) {
            if (dir === 1 && currentStep === questions.length - 1) {
                submitData();
                return;
            }
            currentStep += dir;
            renderQuestion();
        }

function submitData() {
const scriptURL = 'https://script.google.com/macros/s/AKfycbymz_yFXgSAshBZ8MyYcG9QX630Ml1g5SWuJk23prjXGzlp1eRPD0HmCQMq5_OFwsO6/exec';

    const container = document.getElementById('question-container');
    container.innerHTML = `
        <div class="text-center py-10">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h3 class="text-xl font-bold text-gray-800">Saving your responses...</h3>
        </div>
    `;
    document.getElementById('prev-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(responses)
    })
    .then(() => {
        container.innerHTML = `
            <div class="text-center py-10">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-2xl font-bold text-gray-800">Survey Complete!</h3>
                <p class="text-gray-500 mt-2">Thank you for helping us shape the future of work.</p>
            </div>
        `;
    })
    .catch(error => {
        console.error('Error!', error.message);
    });
}
        // Add simple fade animation
        document.head.insertAdjacentHTML('beforeend', '<style>.animate-fade-in { animation: fadeIn 0.3s ease-in-out; } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }</style>');

        // Init
        renderQuestion();
    </script>
</body>
</html>
